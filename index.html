<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DermRx — Prior Authorization Documentation Tool</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f5f9;
  --surface: #ffffff;
  --surface2: #eef2f7;
  --border: #dde4ed;
  --accent: #4278b5;
  --accent-light: #e8f0fa;
  --accent-hover: #335f9a;
  --text-primary: #1b2c3e;
  --text-secondary: #526070;
  --text-muted: #8fa3b8;
  --green: #2a7a50;
  --green-bg: #e8f5ee;
  --green-border: #b3d9c4;
  --red: #b03c3c;
  --red-bg: #fdf0f0;
  --red-border: #ebbfbf;
  --amber: #7a5a00;
  --amber-bg: #fdf6e3;
  --amber-border: #e8d090;
  --purple: #5a4589;
  --purple-bg: #f0ecf9;
  --purple-border: #c5b8e8;
  --teal: #1f6f78;
  --teal-bg: #e4f2f3;
  --teal-border: #a9d3d6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
  --shadow-md: 0 3px 10px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.05);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.1), 0 3px 8px rgba(0,0,0,0.06);
  --r: 10px;
  --r-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }

header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  height: 58px; padding: 0 28px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 300; box-shadow: var(--shadow-sm);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.logo-mark svg { width: 18px; height: 18px; fill: white; }
.logo-name { font-family: 'DM Serif Display', serif; font-size: 1.2rem; color: var(--text-primary); letter-spacing: -0.01em; }
.logo-name span { color: var(--accent); }
.hdr-tag { font-size: .72rem; color: var(--text-muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; }

main { max-width: 880px; margin: 0 auto; padding: 32px 20px 72px; }

.hero { text-align: center; margin-bottom: 28px; }
.hero h1 { font-family: 'DM Serif Display', serif; font-size: 1.85rem; letter-spacing: -0.02em; margin-bottom: 5px; }
.hero p { color: var(--text-secondary); font-size: .93rem; margin-bottom: 20px; }

.search-wrap { position: relative; max-width: 520px; margin: 0 auto; }
.search-ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
#searchInput {
  width: 100%; padding: 12px 14px 12px 40px;
  font-family: 'DM Sans', sans-serif; font-size: .97rem;
  border: 1.5px solid var(--border); border-radius: var(--r);
  background: var(--surface); color: var(--text-primary);
  outline: none; box-shadow: var(--shadow-sm);
  transition: border-color .15s, box-shadow .15s;
}
#searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66,120,181,.13); }
#searchInput::placeholder { color: var(--text-muted); }

.age-filter { display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 12px; flex-wrap: wrap; }
.age-filter-label { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--text-secondary); font-weight: 500; }
.age-filter-label svg { color: var(--accent); }
.age-input-wrap { position: relative; display: inline-flex; align-items: center; }
#ageInput {
  width: 66px; padding: 6px 8px; font-family: 'DM Sans', sans-serif; font-size: .88rem;
  border: 1.5px solid var(--border); border-radius: var(--r-sm); background: var(--surface);
  color: var(--text-primary); outline: none; text-align: center;
}
#ageInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66,120,181,.13); }
#ageUnit {
  font-family: 'DM Sans', sans-serif; font-size: .82rem; padding: 6px 6px; border: 1.5px solid var(--border);
  border-radius: var(--r-sm); background: var(--surface); color: var(--text-secondary); outline: none; cursor: pointer;
}
.age-clear { display: none; font-family: 'DM Sans', sans-serif; font-size: .78rem; font-weight: 500; color: var(--accent);
  background: var(--accent-light); border: 1px solid var(--accent); border-radius: 20px; padding: 4px 11px; cursor: pointer; transition: all .12s; }
.age-clear:hover { background: var(--accent); color: #fff; }
.age-clear.show { display: inline-flex; align-items: center; gap: 5px; }
.age-summary { width: 100%; text-align: center; margin-top: 8px; font-size: .8rem; color: var(--text-secondary); display: none; }
.age-summary.show { display: block; }
.age-summary strong { color: var(--accent); }
.ind-pill.age-hidden { opacity: .34; }
.ind-pill.age-hidden::after { content: ' \00b7 not labeled for this age'; font-weight: 400; font-size: .74rem; color: var(--text-muted); }

.wt-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; padding: 8px 10px; background: var(--amber-bg); border: 1px solid var(--amber-border); border-radius: var(--r-sm); }
.wt-bar-label { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--amber); }
.wt-input { width: 62px; padding: 5px 7px; font-family: 'DM Sans', sans-serif; font-size: .85rem; border: 1.5px solid var(--amber-border); border-radius: 6px; background: var(--surface); color: var(--text-primary); outline: none; text-align: center; }
.wt-input:focus { border-color: var(--amber); }
.wt-unit { font-family: 'DM Sans', sans-serif; font-size: .8rem; padding: 5px 5px; border: 1.5px solid var(--amber-border); border-radius: 6px; background: var(--surface); color: var(--text-secondary); outline: none; cursor: pointer; }
.wt-clear { font-family: 'DM Sans', sans-serif; font-size: .75rem; font-weight: 500; color: var(--amber); background: transparent; border: none; cursor: pointer; text-decoration: underline; padding: 2px 4px; }
.wt-hint { font-size: .74rem; color: var(--text-muted); width: 100%; }
.dose-line.wt-match { background: rgba(217,164,65,.22); border-radius: 4px; font-weight: 600; padding: 1px 4px; margin: 0 -4px; display: inline-block; }
.dose-line.wt-dim { opacity: .4; }

#acDrop {
  display: none; position: absolute; top: calc(100% + 5px); left: 0; right: 0;
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r);
  box-shadow: var(--shadow-lg); z-index: 400; max-height: 320px; overflow-y: auto;
}
#acDrop.open { display: block; }
.ac-label { padding: 7px 14px 4px; font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); background: var(--surface2); border-bottom: 1px solid var(--border); }
.ac-item { padding: 9px 14px; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; border-bottom: 1px solid var(--surface2); transition: background .1s; }
.ac-item .ac-dot { margin-top: 7px; }
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.hi { background: var(--accent-light); }
.ac-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .45; flex-shrink: 0; }
.ac-brand { font-weight: 600; font-size: .93rem; flex: 1; }
.ac-gen { font-size: .8rem; color: var(--text-secondary); font-style: italic; }
.ac-textcol { flex: 1; min-width: 0; }
.ac-line1 { display: flex; align-items: center; gap: 10px; }
.ac-forind { font-size: .77rem; color: var(--accent); margin-top: 2px; }
.ac-cnt { font-size: .73rem; color: var(--text-muted); margin-left: auto; white-space: nowrap; }

.stats-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.stat { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 11px; box-shadow: var(--shadow-sm); }
.stat strong { color: var(--accent); }

.browse-header { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 10px; }
.browse-toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.browse-toprow .browse-header { margin-bottom: 0; }
.browse-toggle { display: inline-flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
.bt-btn { font-family: 'DM Sans', sans-serif; font-size: .78rem; font-weight: 500; padding: 5px 12px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; border-radius: 6px; transition: all .13s; }
.bt-btn:hover { color: var(--accent); }
.bt-btn.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }
.drug-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 24px; }
.drug-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; font-size: .85rem; font-weight: 500; color: var(--text-primary); cursor: pointer; transition: all .14s; white-space: nowrap; font-family: 'DM Sans', sans-serif; }
.drug-chip:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.drug-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip-gen { font-size: .73rem; font-weight: 400; opacity: .7; font-style: italic; }
.disease-chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; font-size: .85rem; font-weight: 500; color: var(--text-primary); cursor: pointer; transition: all .14s; white-space: nowrap; font-family: 'DM Sans', sans-serif; }
.disease-chip:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.disease-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.disease-chip.active .dc-count { background: rgba(255,255,255,.25); color: #fff; }
.dc-count { font-size: .7rem; font-weight: 600; background: var(--accent-light); color: var(--accent); border-radius: 10px; padding: 1px 7px; min-width: 18px; text-align: center; }

.divider { height: 1px; background: var(--border); margin: 4px 0 20px; }

.drug-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-md); margin-bottom: 12px; overflow: hidden; animation: pop .18s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

.card-head { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; transition: background .12s; }
.card-head:hover { background: var(--accent-light); }
.card-head.open { background: var(--accent-light); border-bottom: 1px solid var(--border); }
.card-left { display: flex; align-items: center; gap: 13px; }
.avatar { width: 38px; height: 38px; border-radius: 8px; background: var(--accent-light); border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .82rem; color: var(--accent); flex-shrink: 0; }
.card-brand { font-size: 1rem; font-weight: 600; }
.card-generic { font-size: .78rem; color: var(--text-secondary); font-style: italic; margin-top: 1px; }
.card-right { display: flex; align-items: center; gap: 8px; }
.ind-badge { font-size: .73rem; color: var(--text-muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; }
.chevron { color: var(--text-muted); transition: transform .2s; flex-shrink: 0; }
.chevron.open { transform: rotate(180deg); }

.card-body { display: none; padding: 0 20px 14px; }
.card-body.open { display: block; }
.ind-label { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); padding: 12px 0 8px; }
.ind-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.ind-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 7px; font-size: .86rem; font-weight: 500; color: var(--text-primary); cursor: pointer; transition: all .13s; font-family: 'DM Sans', sans-serif; }
.ind-pill:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.ind-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.detail-panel { display: none; margin-top: 12px; border: 1.5px solid var(--border); border-radius: var(--r); overflow: hidden; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.detail-panel.open { display: block; }
.dp-head { padding: 12px 16px; background: var(--accent); color: #fff; font-size: .88rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

.cat-block { border-bottom: 1px solid var(--border); }
.cat-block:last-child { border-bottom: none; }
.cat-head { padding: 11px 16px; display: flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; background: var(--surface); transition: background .12s; }
.cat-head:hover, .cat-head.open { background: var(--surface2); }
.cat-icon { width: 26px; height: 26px; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cat-icon.dosing { background: var(--amber-bg); color: var(--amber); }
.cat-icon.checklist { background: var(--green-bg); color: var(--green); }
.cat-icon.denials { background: var(--red-bg); color: var(--red); }
.cat-icon.template { background: var(--purple-bg); color: var(--purple); }
.cat-icon.labs { background: var(--teal-bg); color: var(--teal); }
.cat-title { font-weight: 600; font-size: .88rem; flex: 1; }
.cat-title.dosing { color: var(--amber); }
.cat-title.checklist { color: var(--green); }
.cat-title.denials { color: var(--red); }
.cat-title.template { color: var(--purple); }
.cat-title.labs { color: var(--teal); }
.cat-chev { color: var(--text-muted); transition: transform .18s; flex-shrink: 0; }
.cat-chev.open { transform: rotate(180deg); }
.cat-body { display: none; padding: 0 16px 14px 51px; font-size: .86rem; line-height: 1.72; }
.cat-body.open { display: block; }
.cat-body.dosing { background: var(--amber-bg); border-top: 1px solid var(--amber-border); }
.cat-body.checklist { background: var(--green-bg); border-top: 1px solid var(--green-border); }
.cat-body.denials { background: var(--red-bg); border-top: 1px solid var(--red-border); }
.cat-body.template { background: var(--purple-bg); border-top: 1px solid var(--purple-border); }
.cat-body.labs { background: var(--teal-bg); border-top: 1px solid var(--teal-border); }
.lab-sub { padding-top: 11px; }
.lab-sub + .lab-sub { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--teal-border); }
.lab-sub-head { font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--teal); margin-bottom: 4px; }
.lab-sub-head.labs-req { color: var(--teal); }
.lab-sub-head.labs-req::before { content: '\2713  '; }
.lab-sub-head.labs-mon { color: var(--text-secondary); }
.lab-sub-head.labs-practice { color: var(--amber); }
.lab-sub-head.labs-practice::before { content: '\25CB  '; }
.lab-sub-body { font-size: .86rem; line-height: 1.6; color: var(--text-primary); }
.lab-none { font-size: .86rem; line-height: 1.6; color: var(--text-primary); padding-top: 11px; }
.lab-note { margin-top: 10px; font-size: .77rem; line-height: 1.5; color: var(--text-secondary); font-style: italic; }
.cat-body pre { white-space: pre-wrap; font-family: 'DM Sans', sans-serif; font-size: .86rem; line-height: 1.75; padding-top: 11px; }

.cl-list { padding-top: 11px; }
.cl-item { display: flex; gap: 9px; padding: 7px 0; border-bottom: 1px solid rgba(42,122,80,.13); }
.cl-item:last-of-type { border-bottom: none; }
.cl-check { flex-shrink: 0; width: 18px; height: 18px; border-radius: 5px; background: var(--surface); border: 1.5px solid var(--green-border); color: var(--green); display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.cl-text { flex: 1; font-size: .86rem; line-height: 1.5; color: var(--text-primary); }
.cl-risk { display: flex; align-items: flex-start; gap: 5px; margin-top: 4px; font-size: .77rem; line-height: 1.4; color: var(--red); }
.cl-risk svg { flex-shrink: 0; margin-top: 3px; opacity: .85; }
.cl-tail { margin-top: 12px; padding: 10px 12px; background: var(--red-bg); border: 1px solid var(--red-border); border-radius: var(--r-sm); }
.cl-tail-head { display: flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--red); margin-bottom: 6px; }
.cl-tail-item { font-size: .82rem; line-height: 1.5; color: var(--text-secondary); padding: 2px 0 2px 14px; position: relative; }
.cl-tail-item::before { content: ''; position: absolute; left: 3px; top: 11px; width: 4px; height: 4px; border-radius: 50%; background: var(--red); opacity: .55; }

.copy-row { display: flex; justify-content: flex-end; padding-top: 9px; }
.copy-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border: 1.5px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--text-secondary); font-family: 'DM Sans', sans-serif; font-size: .78rem; font-weight: 500; cursor: pointer; transition: all .13s; }
.copy-btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
.copy-btn.copied { background: var(--green-bg); border-color: var(--green); color: var(--green); }

.empty { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: .93rem; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L19 10l-9 9z"/></svg>
    </div>
    <span class="logo-name">Derm<span>Rx</span> Prior Authorization Documentation Tool</span>
  </div>
  <span class="hdr-tag">Derm Residency Tool</span>
</header>

<main>
  <div class="hero">
    <h1>Derm Drug Reference</h1>
    <p>Search by drug, generic name, or disease &mdash; or browse the full list below</p>
    <div class="search-wrap">
      <svg class="search-ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="Search drug, generic, or disease (e.g. eczema, psoriasis)..." autocomplete="off" spellcheck="false"/>
      <div id="acDrop"></div>
    </div>
    <div class="age-filter">
      <span class="age-filter-label">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Patient age
      </span>
      <span class="age-input-wrap">
        <input id="ageInput" type="number" min="0" step="1" inputmode="decimal" placeholder="e.g. 7" autocomplete="off"/>
      </span>
      <select id="ageUnit" aria-label="Age unit">
        <option value="years">years</option>
        <option value="months">months</option>
      </select>
      <button class="age-clear" id="ageClear" type="button">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Clear
      </button>
      <div class="age-summary" id="ageSummary"></div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--accent)"><circle cx="12" cy="12" r="10"/><path fill="white" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <strong id="statDrugs">31</strong> medications
    </div>
    <div class="stat">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--accent)"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <strong id="statInds">42</strong> indications
    </div>
    <div class="stat">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      Dosing &middot; Checklists &middot; Denials &middot; Labs &middot; Templates
    </div>
  </div>

  <div class="browse-toprow">
    <div class="browse-header" id="browseHeader">All Medications &mdash; click to jump</div>
    <div class="browse-toggle" id="browseToggle">

    if (m = s.match(/(\d+)\s*-\s*(\d+)\s*kg/)) return { min: +m[1], max: +m[2] };
    if (m = s.match(/<\s*(\d+)\s*kg/)) return { min: 0, max: +m[1] };
    if (m = s.match(/\u2264\s*(\d+)\s*kg/)) return { min: 0, max: +m[1] + 0.0001 };
    if (m = s.match(/>\s*(\d+)\s*kg/)) return { min: +m[1] + 0.0001, max: null };
    if (m = s.match(/\u2265\s*(\d+)\s*kg/)) return { min: +m[1], max: null };

  // Is a line a section header (no weight band, but names an age group/range)? Returns

  function parseSectionHeader(line) {
    var endsColon = /:\s*$/.test(line);
    // A weight-band line isn't a header — unless it's a colon-terminated section title
    // that merely mentions a weight floor (e.g. "Peds ≥12 years and ≥30 kg (weight-based):").
    if (parseWeightLine(line) && !endsColon) return null;
    var s = line.toLowerCase().replace(/[\u2013\u2014]/g, '-');
    var hasHeaderShape = endsColon || /year|month|adult|peds|pediatric|child/.test(s);
    if (!hasHeaderShape) return null;
    var m, ageMin = null, ageMax = null, group = null;
    // "6 months-5 years"
    if (m = s.match(/(\d+)\s*months?\s*-\s*(\d+)\s*years?/)) { ageMin = +m[1] / 12; ageMax = +m[2]; group = 'peds'; }
    else if (m = s.match(/(\d+)\s*-\s*(\d+)\s*years?/)) { ageMin = +m[1]; ageMax = +m[2]; group = 'peds'; }

    else if (/adult/.test(s)) { group = 'adult'; ageMin = 18; }
    else if (/ped|child/.test(s)) { group = 'peds'; }
    if (!group) return null;
    return { group: group, ageMin: ageMin, ageMax: ageMax };

  // except adult/peds are mutually exclusive at 18 so an adult weight doesn't light up
  // an open-ended peds band (and vice versa).
  function ageInSection(ageYears, hdr) {
    if (ageYears == null || !hdr) return true;
    if (hdr.group === 'peds' && ageYears >= 18) return false;
    if (hdr.group === 'adult' && ageYears < 18) return false;
    if (hdr.ageMin != null && ageYears < hdr.ageMin) return false;
    if (hdr.ageMax != null && ageYears > hdr.ageMax) return false;
    return true;
  }

  function renderDosingHighlighted(dosing, weightKg, ageYears) {

      if (hdr) { curHdr = hdr; return '<span class="dose-line">' + esc(line) + '</span>'; }
      if (wb && weightKg != null) {

    var copyHtml = '';
    if (copyable) {
      copyHtml = '<div class="copy-row"><button class="copy-btn" data-content="' + esc(content) + '"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy Template</button></div>';
    }
    return '<div class="cat-block">' +
      '<div class="cat-head" onclick="DERMRX.toggleCat(this)">' +
        '<div class="cat-icon ' + type + '">' + ICONS[type] + '</div>' +
        '<span class="cat-title ' + type + '">' + LABELS[type] + '</span>' +
        '<svg class="cat-chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>' +
      '</div>' +
      '<div class="cat-body ' + type + '"><pre>' + esc(content) + '</pre>' + copyHtml + '</div>' +
    '</div>';
  }

  // Dosing panel with optional weight-band highlighter (only when line-separated bands exist).
  function renderDosing(drugKey, idx, dosing) {
    var banded = hasWeightBands(dosing);
    var wtBar = '';
    if (banded) {
      wtBar = '<div class="wt-bar" data-drug="' + esc(drugKey) + '" data-i="' + idx + '">' +
        '<span class="wt-bar-label">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5h11l1.5 13h-14z"/><path d="M9 6.5a3 3 0 0 1 6 0"/></svg>' +
          'Weight</span>' +
        '<input class="wt-input" type="number" min="0" step="0.1" inputmode="decimal" placeholder="e.g. 22"/>' +
        '<select class="wt-unit"><option value="kg">kg</option><option value="lb">lb</option></select>' +
        '<button class="wt-clear" type="button">clear</button>' +
        '<span class="wt-hint">Highlights the matching label band. Always verify against the FDA label.</span>' +
      '</div>';
    }
    var inner = '<pre id="dose-pre-' + esc(drugKey) + '-' + idx + '" data-dosing="' + esc(dosing) + '">' + esc(dosing) + '</pre>';
    return '<div class="cat-block">' +
      '<div class="cat-head" onclick="DERMRX.toggleCat(this)">' +
        '<div class="cat-icon dosing">' + ICONS.dosing + '</div>' +
        '<span class="cat-title dosing">' + LABELS.dosing + '</span>' +
        '<svg class="cat-chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>' +
      '</div>' +
      '<div class="cat-body dosing">' + wtBar + inner + '</div>' +
    '</div>';
  }

  // --- Merge denial reasons into the documentation checklist ---
  var MERGE_STOP = {a:1,an:1,the:1,of:1,or:1,and:1,to:1,'in':1,'with':1,documented:1,'for':1,not:1,no:1,clearly:1,stated:1,as:1,'if':1,per:1,payer:1,by:1,that:1,other:1,than:1,'this':1,these:1,applicable:1,when:1,relevant:1,may:1,used:1,using:1,use:1,disease:1,patient:1};
  var MERGE_ANCHORS = ['bsa','severity','weight','age','diagnosis','hurley','salt','renal','duration','genital','nodule','field','flare','rems'];
  function mTok(s) {
    var t = {}; var arr = s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/);
    for (var i=0;i<arr.length;i++){ var w=arr[i]; if (w.length>2 && !MERGE_STOP[w]) t[w]=1; } return t;
  }
  function mAnchors(s) {
    var t = mTok(s), out = {}; var low = s.toLowerCase();
    for (var i=0;i<MERGE_ANCHORS.length;i++){ var a=MERGE_ANCHORS[i];
      if (t[a] || (a==='diagnosis' && (t.dx || low.indexOf('diagnosis')!==-1))) out[a]=1; }
    return out;
  }
  function mOverlap(a,b){ var n=0; for (var k in a) if (b[k]) n++; return n; }
  function mBullets(block) {
    var lines = block.split('\n'), out = [];
    for (var i=0;i<lines.length;i++){
      var line = lines[i].replace(/^\s+|\s+$/g,'');
      if (line.charAt(0)==='\u2022') out.push(line.replace(/^\u2022\s*/,''));
      else if (line && out.length) out[out.length-1] += ' ' + line;
      else if (line) out.push(line);
    }
    return out;
  }
  // Turn "BSA documented" -> "BSA" style short risk label from a denial reason
  function shortRisk(d) {
    return d.replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');
  }

  function renderChecklistMerged(checklistBlock, denialsBlock) {
    var items = mBullets(checklistBlock), denials = mBullets(denialsBlock);
    var itemTok = items.map(mTok), itemAnc = items.map(mAnchors);
    var attached = items.map(function(){ return []; });
    var tail = [];
    for (var i=0;i<denials.length;i++){
      var d = denials[i], dt = mTok(d), da = mAnchors(d), best = 0, bi = -1;
      for (var j=0;j<items.length;j++){
        var score = mOverlap(dt,itemTok[j]) + (mOverlap(da,itemAnc[j]) ? 3 : 0);
        if (score > best){ best = score; bi = j; }
      }
      if (best >= 2 && bi >= 0) attached[bi].push(d); else tail.push(d);
    }
    var rows = items.map(function(it, idx){
      var risk = attached[idx].length
        ? '<div class="cl-risk"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><span>Denied if: ' +
          attached[idx].map(function(x){ return esc(shortRisk(x)); }).join('; ') + '</span></div>'
        : '';
      return '<div class="cl-item"><span class="cl-check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6L9 17l-5-5"/></svg></span>' +
        '<div class="cl-text">' + esc(it) + risk + '</div></div>';
    }).join('');
    var tailHtml = tail.length
      ? '<div class="cl-tail"><div class="cl-tail-head"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>Also commonly denied for</div>' +
        tail.map(function(x){ return '<div class="cl-tail-item">' + esc(x) + '</div>'; }).join('') + '</div>'
      : '';
    return '<div class="cat-block">' +
      '<div class="cat-head" onclick="DERMRX.toggleCat(this)">' +
        '<div class="cat-icon checklist">' + ICONS.checklist + '</div>' +
        '<span class="cat-title checklist">Documentation Checklist</span>' +
        '<svg class="cat-chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>' +
      '</div>' +
      '<div class="cat-body checklist"><div class="cl-list">' + rows + tailHtml + '</div></div>' +
    '</div>';
  }

  function renderCards(keys) {
    if (!keys.length) { drugList.innerHTML = '<div class="empty">No medications match your search.</div>'; return; }
    drugList.innerHTML = keys.map(function(k) {
      var d = DATA[k];
      var inds = Object.keys(d.indications);
      var elig = eligibleIndsForAge(k, pedAge);
      var pillsHtml = inds.map(function(ind, i) {
        var hidden = (pedAge != null && elig.indexOf(ind) === -1);
        return '<button class="ind-pill' + (hidden ? ' age-hidden' : '') + '" data-drug="' + esc(k) + '" data-i="' + i + '">' +
          '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>' +
          esc(ind) + '</button>';
      }).join('');
      var detailsHtml = inds.map(function(ind, i) {
        var info = d.indications[ind];
        return '<div class="detail-panel" id="dp-' + esc(k) + '-' + i + '">' +
          '<div class="dp-head"><svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L19 10l-9 9z"/></svg>' +
          (function(){
            var ZORYVE_FORMS = {
              'Mild\u2013moderate atopic dermatitis \u2014 Peds 2\u20135 years': 'roflumilast cream 0.05%',
              'Mild\u2013moderate atopic dermatitis \u2014 Adults & peds \u22656 years': 'roflumilast cream 0.15%',
              'Plaque psoriasis, incl. intertriginous \u2014 Adults & peds \u22656 years': 'roflumilast cream 0.3%',
              'Seborrheic dermatitis \u2014 Adults & peds \u22659 years': 'roflumilast foam 0.3%',
              'Plaque psoriasis, scalp & body \u2014 Adults & peds \u226512 years': 'roflumilast foam 0.3%'
            };
            var form = (k === 'ZORYVE' && ZORYVE_FORMS[ind]) ? ' (' + ZORYVE_FORMS[ind] + ')' : '';
            return esc(d.brand) + form + ' \u2014 ' + esc(ind);
          }()) + '</div>' +
          renderDosing(k, i, info.dosing) +
          renderChecklistMerged(info.checklist, info.denials) +
          renderLabs(k) +
          renderCat('template', info.template, true) +
          '</div>';
      }).join('');
      return '<div class="drug-card" id="card-' + esc(k) + '">' +
        '<div class="card-head" data-key="' + esc(k) + '">' +
          '<div class="card-left"><div class="avatar">' + initials(d.brand) + '</div>' +
            '<div><div class="card-brand">' + esc(d.brand) + '</div><div class="card-generic">' + esc(d.generic) + '</div></div>' +
          '</div>' +
          '<div class="card-right"><span class="ind-badge">' + inds.length + ' indication' + (inds.length > 1 ? 's' : '') + '</span>' +
          '<svg class="chevron" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>' +
        '</div>' +
        '<div class="card-body" id="cb-' + esc(k) + '">' +
          '<div class="ind-label">Select indication</div><div class="ind-pills">' + pillsHtml + '</div>' + detailsHtml +
        '</div></div>';
    }).join('');

    drugList.querySelectorAll('.card-head').forEach(function(h) {
      h.addEventListener('click', function() { toggleCard(h.dataset.key); });
    });
    drugList.querySelectorAll('.ind-pill').forEach(function(p) {
      p.addEventListener('click', function(e) { e.stopPropagation(); toggleInd(p.dataset.drug, parseInt(p.dataset.i)); });
    });
    drugList.querySelectorAll('.wt-bar').forEach(function(bar) {
      var input = bar.querySelector('.wt-input');
      var unit = bar.querySelector('.wt-unit');
      var clear = bar.querySelector('.wt-clear');
      var pre = document.getElementById('dose-pre-' + bar.dataset.drug + '-' + bar.dataset.i);
      function apply() {
        var raw = input.value.trim();
        var dosing = pre.getAttribute('data-dosing');
        if (raw === '' || isNaN(parseFloat(raw)) || parseFloat(raw) < 0) {
          pre.innerHTML = esc(dosing); // reset to plain
          return;
        }
        var val = parseFloat(raw);
        var kg = (unit.value === 'lb') ? (val / 2.2046226218) : val;
        pre.innerHTML = renderDosingHighlighted(dosing, kg, pedAge);
      }
      input.addEventListener('input', apply);
      unit.addEventListener('change', apply);
      clear.addEventListener('click', function() { input.value = ''; apply(); input.focus(); });
    });
  }

  window.DERMRX = {
    toggleCat: function(head) {
      var body = head.nextElementSibling;
      var chev = head.querySelector('.cat-chev');
      var open = body.classList.contains('open');
      body.classList.toggle('open', !open);
      chev.classList.toggle('open', !open);
      head.classList.toggle('open', !open);
      if (!open) {
        body.querySelectorAll('.copy-btn').forEach(function(btn) {
          if (!btn._b) {
            btn._b = true;
            btn.addEventListener('click', function() {
              navigator.clipboard.writeText(btn.dataset.content).then(function() {
                btn.classList.add('copied');
                btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>Copied!';
                setTimeout(function() {
                  btn.classList.remove('copied');
                  btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy Template';
                }, 2200);
              });
            });
          }
        });
      }
    }
  };

  function toggleCard(key) {
    var head = drugList.querySelector('.card-head[data-key="' + key + '"]');
    var body = document.getElementById('cb-' + key);
    var chev = head.querySelector('.chevron');
    var open = body.classList.contains('open');
    body.classList.toggle('open', !open);
    chev.classList.toggle('open', !open);
    head.classList.toggle('open', !open);
  }

  function toggleInd(key, idx) {
    var pill = drugList.querySelector('.ind-pill[data-drug="' + key + '"][data-i="' + idx + '"]');
    var panel = document.getElementById('dp-' + key + '-' + idx);
    var wasActive = pill.classList.contains('active');
    drugList.querySelectorAll('.ind-pill[data-drug="' + key + '"]').forEach(function(p) { p.classList.remove('active'); });
    drugList.querySelectorAll('[id^="dp-' + key + '-"]').forEach(function(d) { d.classList.remove('open'); });
    if (!wasActive) {
      pill.classList.add('active');
      panel.classList.add('open');
      setTimeout(function() { panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 60);
    }
  }

  function filtered(q) {
    if (!q) return INDEX;
    var ql = q.toLowerCase().replace(/^\s+|\s+$/g,'');
    // Short queries (<=3 chars, e.g. AK, HS, PN, DM) match only as whole words
    // to avoid substring collisions ("ak" inside "plaque", "hs" inside "months").
    if (ql.length <= 3) {
      var re = new RegExp('(^|[^a-z])' + ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '([^a-z]|$)');
      return INDEX.filter(function(x) { return re.test(x.search); });
    }
    return INDEX.filter(function(x) { return x.search.indexOf(ql) !== -1; });
  }

  function hl(text, q) {
    if (!q) return esc(text);
    var i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i === -1) return esc(text);
    return esc(text.substring(0,i)) + '<strong style="color:var(--accent)">' + esc(text.substring(i, i+q.length)) + '</strong>' + esc(text.substring(i+q.length));
  }

  // Find which indication a query matched (for disease search display)
  function matchedInd(item, q) {
    if (!q) return null;
    var ql = q.toLowerCase();
    // direct substring in an indication name
    for (var i = 0; i < item.indications.length; i++) {
      if (item.indications[i].toLowerCase().indexOf(ql) !== -1) return item.indications[i];
    }
    // synonym hit -> map back to the indication whose synonyms contain the query
    for (var j = 0; j < item.indications.length; j++) {
      if (synFor(item.indications[j]).toLowerCase().indexOf(ql) !== -1) return item.indications[j];
    }
    return null;
  }

  function showDrop(items, q) {
    if (!items.length) {
      acDrop.innerHTML = '<div style="padding:11px 14px;color:var(--text-muted);font-size:.87rem;">No results found</div>';
    } else {
      var ql = (q || '').toLowerCase();
      acDrop.innerHTML = '<div class="ac-label">Medications</div>' +
        items.map(function(item, i) {
          var cnt = item.indications.length;
          var isDrugMatch = item.drugSearch.indexOf(ql) !== -1;
          var mi = isDrugMatch ? null : matchedInd(item, q);
          var indLine = mi ? '<div class="ac-forind">for ' + hl(mi, q) + '</div>' : '';
          return '<div class="ac-item" data-key="' + esc(item.key) + '" data-i="' + i + '">' +
            '<span class="ac-dot"></span>' +
            '<div class="ac-textcol">' +
              '<div class="ac-line1"><span class="ac-brand">' + hl(item.brand, q) + '</span>' +
              '<span class="ac-gen">' + hl(item.generic, q) + '</span></div>' +
              indLine +
            '</div>' +
            '<span class="ac-cnt">' + cnt + ' ind.</span></div>';
        }).join('');
    }
    acDrop.classList.add('open');
    acDrop.querySelectorAll('.ac-item').forEach(function(item) {
      item.addEventListener('mousedown', function(e) { e.preventDefault(); selectDrug(item.dataset.key); });
    });
  }

  function closeDrop() { acDrop.classList.remove('open'); acIdx = -1; }

  function selectDrug(key) {
    searchInput.value = DATA[key].brand;
    closeDrop();
    selection = { type: 'drug', key: key };
    applyAgeFilter();
    drugGrid.querySelectorAll('.drug-chip').forEach(function(c) { c.classList.toggle('active', c.dataset.key === key); });
    diseaseGrid.querySelectorAll('.disease-chip').forEach(function(c){ c.classList.remove('active'); });
    setTimeout(function() {
      var card = document.getElementById('card-' + key);
      if (card) {
        toggleCard(key);
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }, 80);
  }

  var ageInput = document.getElementById('ageInput');
  var ageUnit = document.getElementById('ageUnit');
  var ageClear = document.getElementById('ageClear');
  var ageSummary = document.getElementById('ageSummary');

  // The current "base" selection that the age filter narrows. One of:
  //   {type:'all'}                      -> full list (default / cleared)
  //   {type:'search', q:'...'}          -> text search
  //   {type:'disease', name:'...', keys:[...]} -> a disease chip
  //   {type:'drug', key:'...'}          -> a single drug chip/autocomplete pick
  var selection = { type: 'all' };

  // Resolve the current selection to a base key list (before age narrowing).
  function currentBaseKeys() {
    if (selection.type === 'search') return filtered(selection.q).map(function(x){ return x.key; });
    if (selection.type === 'disease') return selection.keys.slice();
    if (selection.type === 'drug') return [selection.key];
    return KEYS.slice();
  }

  // Recompute pedAge from inputs, then re-render cards honoring both search + age.
  function applyAgeFilter() {
    var raw = ageInput.value.trim();
    if (raw === '' || isNaN(parseFloat(raw)) || parseFloat(raw) < 0) {
      pedAge = null;
    } else {
      var val = parseFloat(raw);
      pedAge = (ageUnit.value === 'months') ? (val / 12) : val;
    }
    ageClear.classList.toggle('show', pedAge != null);

    var base = currentBaseKeys();
    var keys = base;
    // Whole-drug age filtering applies to broad views (all / disease / search).
    // An explicit single-drug pick stays visible with its pills dimmed.
    if (pedAge != null && selection.type !== 'drug') {
      keys = base.filter(function(k){ return eligibleIndsForAge(k, pedAge).length > 0; });
    }

    if (pedAge != null && keys.length === 0 && selection.type !== 'drug') {
      var ctx = (selection.type === 'disease') ? (' for ' + esc(selection.name)) :
                (selection.type === 'search') ? ' matching your search' : '';
      drugList.innerHTML = '<div class="empty">No medications labeled' + ctx + ' at this age.</div>';
    } else {
      renderCards(keys);
    }

    if (pedAge != null && selection.type !== 'drug') {
      var totalInds = keys.reduce(function(n,k){ return n + eligibleIndsForAge(k, pedAge).length; }, 0);
      var ageLabel = (ageUnit.value === 'months') ? (ageInput.value.trim() + ' mo') : (ageInput.value.trim() + ' yr');
      var scope = (selection.type === 'disease') ? (' for <strong>' + esc(selection.name) + '</strong>') : '';
      ageSummary.innerHTML = 'Showing <strong>' + keys.length + '</strong> medication' + (keys.length===1?'':'s') +
        scope + ' with <strong>' + totalInds + '</strong> age-appropriate indication' + (totalInds===1?'':'s') +
        ' for a <strong>' + esc(ageLabel) + '</strong> patient. Greyed pills aren\u2019t labeled for this age.';
      ageSummary.classList.add('show');
    } else {
      ageSummary.classList.remove('show');
    }
  }

  ageInput.addEventListener('input', applyAgeFilter);
  ageUnit.addEventListener('change', applyAgeFilter);
  ageClear.addEventListener('click', function() {
    ageInput.value = '';
    pedAge = null;
    applyAgeFilter();
    ageInput.focus();
  });

  searchInput.addEventListener('input', function() {
    var q = searchInput.value.trim();
    var items = filtered(q);
    if (q) {
      showDrop(items, q);
      selection = { type: 'search', q: q };
      diseaseGrid.querySelectorAll('.disease-chip').forEach(function(c){ c.classList.remove('active'); });
    } else {
      closeDrop();
      drugGrid.querySelectorAll('.drug-chip').forEach(function(c){c.classList.remove('active');});
      selection = { type: 'all' };
    }
    applyAgeFilter(); // re-render honoring both search + age
    acIdx = -1;
  });

  searchInput.addEventListener('focus', function() { var q = searchInput.value.trim(); if (q) showDrop(filtered(q), q); });
  searchInput.addEventListener('blur', function() { setTimeout(closeDrop, 160); });
  searchInput.addEventListener('keydown', function(e) {
    var items = acDrop.querySelectorAll('.ac-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); acIdx = Math.min(acIdx+1, items.length-1); items.forEach(function(el,i){el.classList.toggle('hi',i===acIdx);}); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); acIdx = Math.max(acIdx-1, 0); items.forEach(function(el,i){el.classList.toggle('hi',i===acIdx);}); }
    else if (e.key === 'Enter' && acIdx >= 0 && items[acIdx]) { e.preventDefault(); selectDrug(items[acIdx].dataset.key); }
    else if (e.key === 'Escape') closeDrop();
  });

  renderGrid(KEYS);
  renderDiseaseGrid();
  renderCards(KEYS);
  document.getElementById('statDrugs').textContent = KEYS.length;
  document.getElementById('statInds').textContent = KEYS.reduce(function(n,k){return n+Object.keys(DATA[k].indications).length;},0);
})();
</script>
</body>
